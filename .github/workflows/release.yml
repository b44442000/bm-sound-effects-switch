name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.1.1"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-win10.txt

      - name: Build Win10
        run: python build.py win10

      - name: Verify build
        shell: pwsh
        run: |
          if (-not (Test-Path "bm-sound-effects-switch.exe")) { throw "Build output missing" }
          Get-FileHash "bm-sound-effects-switch.exe" -Algorithm SHA256 | Format-List

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { $tag = "${{ inputs.tag }}" }
          gh release create $tag "bm-sound-effects-switch.exe" --generate-notes --title $tag
