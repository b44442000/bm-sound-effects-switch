name: Python checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q main.py bm_single_instance.py bm_github_update.py build.py
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run updater tests
        run: python -m pytest -q tests/test_bm_github_update.py
